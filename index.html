<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WarCost.Live | Russia War Dashboard</title>

    <meta name="description" content="Live dashboard tracking the estimated economic cost and military impact of Russia's war against Ukraine.">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="hero">

    <div class="container">

        <h1>WARCOST.LIVE</h1>

        <p class="subtitle">
            Russia War Dashboard
        </p>

    </div>

</header>

<main>

<section class="counter">

    <div class="container">

        <h2>Estimated Military Spending</h2>

        <div id="moneyCounter" class="money">

            $514,234,653,345

        </div>

        <div class="per-second">

            + $10.65 / second

        </div>

    </div>

</section>

<section class="days">

    <div class="container">

        <h2>War Duration</h2>

        <div id="daysCounter" class="days-number">

            1615 Days

        </div>

    </div>

</section>

<section class="coming">

    <div class="container">

        <h2>Coming Soon</h2>

        <ul>

            <li>Personnel Losses</li>
            <li>Equipment Losses</li>
            <li>Economic Impact</li>
            <li>Interactive Charts</li>
            <li>Daily Statistics</li>

        </ul>

    </div>

</section>

</main>

<footer>

    <div class="container">

        <p>
            © 2026 WarCost.Live
        </p>

    </div>

</footer>

<script src="assets/js/app.js"></script>

</body>
</html>
